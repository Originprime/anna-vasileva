  var R=host.attachShadow({mode:'open'});
  R.innerHTML="<style>:host{display:block;all:initial}\n\n.av-root{\n  --bg:#FFFFFF; --cover:#CFDED5; --surf:#F1F6F3; --ink:#1C2823; --ink2:#44544D;\n  --acc:#2E5A4D; --acc-hover:#244A3F; --line:#DAE4DE;\n}\n*{box-sizing:border-box;margin:0;padding:0}\n\n.av-root{background:var(--bg);color:var(--ink);font:400 16px/1.55 \"Open Sans\",system-ui,sans-serif}\na{color:inherit}\nimg{display:block;max-width:100%}\nh1,h2,h3,.mont{font-family:Montserrat,system-ui,sans-serif;font-weight:700;line-height:1.3}\nh2{font-size:21px}\n.wrap{max-width:560px;margin:0 auto;padding:0 20px}\nsection{padding-top:28px}\n.muted{color:var(--ink2)}\n\n/* cover + profile */\n.cover{background:linear-gradient(var(--cover) 0 104px,var(--bg) 104px)}\n.hero{text-align:center;padding-top:44px}\n.avatar{width:120px;height:120px;border-radius:50%;border:5px solid #fff;margin:0 auto 14px;object-fit:cover}\n.hero h1{font-size:24px;margin-bottom:6px}\n.hero p{font-size:15px;line-height:1.4}\n\n/* facts */\n.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;list-style:none}\n.facts li{background:var(--surf);border-radius:14px;padding:12px 6px;text-align:center}\n.facts b{display:block;font:700 17px/1.3 Montserrat,sans-serif;color:var(--acc)}\n.facts span{font-size:13px;color:var(--ink2)}\n\n/* buttons */\n.cta-label{text-align:center;font-weight:600;font-size:14px;color:var(--ink2);margin:16px 0 12px}\n.cover .wrap{padding-bottom:22px}\n.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.pill{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:26px;font:700 15px/1.2 Montserrat,sans-serif;text-decoration:none;transition:background .15s}\n.pill svg{width:20px;height:20px;flex:none}\n.pill-main{background:var(--acc);color:#fff}\n.pill-main:hover{background:var(--acc-hover)}\n.pill-alt{background:#fff;color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}\n.pill-alt:hover{background:var(--surf)}\n.pill-white{background:#fff;color:var(--acc)}\n.pill-white:hover{background:var(--surf)}\n\n/* promise */\n.promise{margin:0 -20px;padding:24px 20px;border-top:1px solid rgba(0,0,0,.14);border-bottom:1px solid rgba(0,0,0,.14)}\n.promise .lead{font:700 19px/1.37 Montserrat,sans-serif;margin-bottom:10px}\n.promise p{font-size:15px;line-height:1.55}\n\n/* accordions */\n.acc{display:grid;gap:8px}\n.acc .hint{font-size:14px;color:var(--ink2);margin:4px 0 10px}\n.acc>h2{margin-bottom:8px}\ndetails{border:1px solid var(--line);border-radius:16px;background:#fff;transition:background .35s ease,border-color .35s ease}\ndetails.is-open{background:var(--surf);border-color:var(--surf)}\nsummary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:16px;font:600 16px/1.38 Montserrat,sans-serif}\nsummary::-webkit-details-marker{display:none}\nsummary>span{flex:1}\n.tog{flex:none;width:28px;height:28px;border-radius:50%;background:var(--surf);color:var(--acc);display:grid;place-items:center;transition:transform .35s cubic-bezier(.4,0,.2,1),background .35s,color .35s}\n.tog svg{width:18px;height:18px}\ndetails.is-open .tog{background:var(--acc);color:#fff;transform:rotate(180deg)}\ndetails .body{padding:0 16px 16px;font-size:15px;line-height:1.55;color:var(--ink2);transition:opacity .3s ease}\n.js details:not(.is-open) .body{opacity:0}\n.more-link{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:16px;box-shadow:inset 0 0 0 1.5px var(--acc);text-decoration:none}\n.more-link div{flex:1}\n.more-link b{display:block;font:700 15px/1.4 Montserrat,sans-serif;color:var(--acc)}\n.more-link span{font-size:14px;color:var(--ink2)}\n.more-link svg{width:22px;height:22px;color:var(--acc);flex:none}\n\n/* steps carousel */\n.steps-head p{font-size:14px;color:var(--ink2);margin-top:4px}\n.car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:12px -20px 0;padding:0 20px 4px;scroll-padding:0 20px;list-style:none;scrollbar-width:none}\n.car::-webkit-scrollbar{display:none}\n.car li{flex:0 0 248px;scroll-snap-align:start;background:var(--surf);border-radius:20px;padding:20px 18px 22px}\n.car .n{font:700 34px/1.1 Montserrat,sans-serif;color:var(--acc);margin-bottom:8px}\n.car h3{font-size:17px;margin-bottom:8px}\n.car p{font-size:15px;line-height:1.47;color:var(--ink2)}\n.dots{display:flex;gap:6px;justify-content:center;margin-top:12px}\n.dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .2s,background .2s}\n.dots i.on{width:18px;background:var(--acc)}\n\n/* fit */\n.dots-list{list-style:none;display:grid;gap:6px;margin-top:12px}\n.dots-list li{display:flex;gap:10px;font-size:15px;line-height:1.47}\n.dots-list li::before{content:\"\";flex:none;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-top:7px}\n.warn{display:flex;gap:10px;align-items:center;background:var(--surf);border-radius:12px;padding:12px 14px;margin-top:17px;font-weight:600;font-size:14px;line-height:1.43}\n.warn svg{flex:none;width:20px;height:20px;color:var(--acc)}\n.todo{background:#FFF3C4;color:#6B4E00;padding:2px 6px;border-radius:6px}\n\n/* final band */\n.band{background:var(--acc);color:#fff;margin:28px auto 0;max-width:600px;padding:28px 0;border-radius:20px 20px 0 0}\n@media (min-width:601px){.av-root{background:var(--surf)}main{background:#fff;max-width:600px;margin:0 auto}}\n.band h2{text-align:center;font-size:20px;line-height:1.35;margin-bottom:14px}\nfooter{border-top:1px solid rgba(255,255,255,.2);margin-top:28px;padding-top:20px;text-align:center;display:grid;gap:8px}\nfooter a{font-weight:600;font-size:13px;color:rgba(255,255,255,.9)}\n\n/* dialogs */\ndialog{border:0;padding:0;margin:auto;width:min(560px,calc(100% - 24px));max-height:calc(100dvh - 48px);border-radius:20px;background:#fff;color:var(--ink);box-shadow:0 20px 60px rgba(28,40,35,.25)}\ndialog::backdrop{background:rgba(28,40,35,.5)}\ndialog[open]{display:flex;flex-direction:column}\ndialog:focus{outline:none}\n.dlg-head{displa ультатов анализов. Различные заболевания во время беременности.</div></details>\n      <details><summary><span>Менопауза и МГТ</span><i class=\"tog\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"m6 9 6 6 6-6\"/></svg></i></summary><div class=\"body\">Перименопауза, менопауза, менопаузальная гормональная терапия.</div></details>\n      <details><summary><span>Второе мнение по анализам и УЗИ</span><i class=\"tog\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"m6 9 6 6 6-6\"/></svg></i></summary><div class=\"body\">Разбор анализов, УЗИ, ранее поставленных диагнозов и назначенного лечения.</div></details>\n      <a class=\"more-link\" href=\"TG_LINK\" target=\"_blank\" rel=\"noopener\">\n        <div><b>Нет вашего вопроса?</b><span>Опишите ситуацию в сообщении</span></div>\n        <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M5 12h14m-5-5 5 5-5 5\"/></svg>\n      </a>\n    </section>\n\n    <section aria-labelledby=\"h-steps\">\n      <div class=\"steps-head\">\n        <div><h2 id=\"h-steps\">Как проходит консультация</h2><p>5 шагов · листайте →</p></div>\n        <div class=\"arrows\">\n          <button type=\"button\" id=\"prev\" aria-label=\"Предыдущий шаг\" disabled><svg style=\"transform:scaleX(-1)\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M5 12h14m-5-5 5 5-5 5\"/></svg></button>\n          <button type=\"button\" id=\"next\" aria-label=\"Следующий шаг\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M5 12h14m-5-5 5 5-5 5\"/></svg></button>\n        </div>\n      </div>\n      <ol class=\"car\" id=\"car\">\n        <li><div class=\"n\">01</div><h3>Запись</h3><p>Пишете в Telegram или MAX, согласуем удобные дату и время</p></li>\n        <li><div class=\"n\">02</div><h3>Подготовка</h3><p>Заполняете медицинскую анкету и присылаете анализы, заключения УЗИ и другие документы</p></li>\n        <li><div class=\"n\">03</div><h3>Консультация</h3><p>30–40 минут: жалобы, история заболевания, результаты обследований, предыдущее лечение</p></li>\n        <li><div class=\"n\">04</div><h3>Тактика</h3><p>Определяем, нужны ли дополнительные обследования, обсуждаем варианты лечения</p></li>\n        <li><div class=\"n\">05</div><h3>Рекомендации</h3><p>Получаете рекомендации с планом дальнейших действий</p></li>\n      </ol>\n      <div class=\"dots\" id=\"dots\" aria-hidden=\"true\"><i class=\"on\"></i><i></i><i></i><i></i><i></i></div>\n    </section>\n\n    <section aria-labelledby=\"h-fit\">\n      <h2 id=\"h-fit\">Онлайн-формат подойдёт, если</h2>\n      <ul class=\"dots-list\">\n        <li>нужно второе мнение</li>\n        <li>сомневаетесь в назначенном лечении</li>\n        <li>непонятны результаты анализов или УЗИ</li>\n        <li>планируете беременность или подбираете контрацепцию</li>\n        <li>нет возможности прийти очно</li>\n      </ul>\n      <p class=\"warn\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><path stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" d=\"M12 11v6M12 7.5v.5\"/></svg>Онлайн-консультация не заменяет очный приём врача</p>\n    </section>\n\n    <section class=\"acc\" aria-labelledby=\"h-more\">\n      <h2 id=\"h-more\">Подробнее</h2>\n      <details><summary><span>Что вы получите</span><i class=\"tog\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"m6 9 6 6 6-6\"/></svg></i></summary><div class=\"body\"><span class=\"todo\">Текст раздела — заполнить</span></div></details>\n      <details><summary><span>Обо мне</span><i class=\"tog\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"m6 9 6 6 6-6\"/></svg></i></summary><div class=\"body\"><span class=\"todo\">Образование, опыт, место работы, сертификаты — заполнить</span></div></details>\n      <details><summary><span>Стоимость консультации</span><i class=\"tog\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"m6 9 6 6 6-6\"/></svg></i></summary><div class=\"body\"><span class=\"todo\">Цена и условия оплаты — заполнить</span></div></details>\n      <details><summary><span>Важная информация</span><i class=\"tog\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"m6 9 6 6 6-6\"/></svg></i></summary><div class=\"body\"><span class=\"todo\">Текст раздела — заполнить</span></div></details>\n    </section>\n  </div>\n\n  <section class=\"band\" aria-labelledby=\"h-final\">\n    <div class=\"wrap\">\n      <h2 id=\"h-final\">Остались вопросы?<br>Напишите мне</h2>\n      <div class=\"btns\">\n        <a class=\"pill pill-white\" href=\"TG_LINK\" target=\"_blank\" rel=\"noopener\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path fill=\"currentColor\" d=\"M20.7 4.3 3.4 11c-1 .4-1 1.5 0 1.8l4.3 1.4 1.7 5.2c.2.6 1 .8 1.5.3l2.4-2.2 4.4 3.2c.6.4 1.3.1 1.5-.6l2.9-14c.2-.8-.6-1.4-1.4-1.1Z\"/></svg>Telegram</a>\n        <a class=\"pill pill-white\" href=\"MAX_LINK\" target=\"_blank\" rel=\"noopener\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\" d=\"M5 4.5h14a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-5 4v-4.5A1.5 1.5 0 0 1 3.5 15V6A1.5 1.5 0 0 1 5 4.5Z\"/></svg>MAX</a>\n      </div>\n      <footer>\n        <a href=\"#consent\" data-doc=\"consent\">Согласие на обработку персональных данных</a>\n        <a href=\"#offer\" data-doc=\"offer\">Договор оферты</a>\n        <a href=\"#disclaimer\" data-doc=\"disclaimer\">Дисклеймер</a>\n      </footer>\n    </div>\n  </section>\n</main>\n\n<!-- Документы во всплывающих окнах. TODO: вставить тексты документов -->\n<dialog id=\"consent\" aria-labelledby=\"d-consent\">\n  <div class=\"dlg-head\"><h2 id=\"d-consent\">Согласие на обработку персональных данных</h2><button class=\"x\" aria-label=\"Закрыть\">×</button></div>\n  <div class=\"dlg-body\"><p><span class=\"todo\">Текст согласия — вставить</span></p></div>\n</dialog>\n<dialog id=\"offer\" aria-labelledby=\"d-offer\">\n  <div class=\"dlg-head\"><h2 id=\"d-offer\">Договор оферты</h2><button class=\"x\" aria-label=\"Закрыть\">×</button></div>\n  <div class=\"dlg-body\"><p><span class=\"todo\">Текст договора оферты — вставить</span></p></div>\n</dialog>\n<dialog id=\"disclaimer\" aria-labelledby=\"d-disclaimer\">\n  <div class=\"dlg-head\"><h2 id=\"d-disclaimer\">Дисклеймер</h2><button class=\"x\" aria-label=\"Закрыть\">×</button></div>\n  <div class=\"dlg-body\"><p><span class=\"todo\">Текст дисклеймера — вставить</span></p></div>\n</dialog>\n\n</div>";
  R.querySelector('.av-root').classList.add('js');

  // документы во всплывающих окнах
  function open(id){var d=R.getElementById(id);if(d&&d.showModal&&!d.open){d.showModal();document.body.style.overflow='hidden';}}
  R.querySelectorAll('[data-doc]').forEach(function(a){
    a.addEventListener('click',function(e){e.preventDefault();open(a.dataset.doc);});
  });
  R.querySelectorAll('dialog').forEach(function(d){
    d.querySelector('.x').addEventListener('click',function(){d.close();});
    d.addEventListener('click',function(e){if(e.target===d)d.close();});
    d.addEventListener('close',function(){document.body.style.overflow='';});
  });
  // вопрос-ответ: открыт только один блок в группе
  // плавное раскрытие/сворачивание по высоте
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function slide(d,open){
    if(d._want===open&&(d._anim||d.open===open))return;
    d._want=open;
    var s=d.querySelector('summary');
    var start=d.offsetHeight;
    if(d._anim){d._anim.cancel();}
    d.classList.toggle('is-open',open);
    if(open)d.open=true;
    var end=open?d.offsetHeight:s.offsetHeight+(d.offsetHeight-d.clientHeight);
    if(reduce||!d.animate){if(!open)d.open=false;return;}
    d.style.overflow='hidden';
    var a=d.animate({height:[start+'px',end+'px']},{duration:380,easing:'cubic-bezier(.4,0,.2,1)'});
    d._anim=a;
    a.onfinish=function(){d._anim=null;d.style.overflow='';if(!open)d.open=false;};
    a.oncancel=function(){if(d._anim===a){d._anim=null;d.style.overflow='';}};
  }
  R.querySelectorAll('.acc details').forEach(function(d){
    if(d.open)d.classList.add('is-open');
    d.querySelector('summary').addEventListener('click',function(e){
      e.preventDefault();
      var open=!d.classList.contains('is-open');
      if(open)d.parentElement.querySelectorAll('details.is-open').forEach(function(o){if(o!==d)slide(o,false);});
      slide(d,open);
    });
  });
  // плавное появление блоков
  var items=R.querySelectorAll('.avatar,.hero h1,.hero p,.facts,.cta-label,.cover .btns,main .wrap>section,.band');
  items.forEach(function(el){el.classList.add('rv');});
  var shown=0;
  function show(el){el.style.transitionDelay=Math.min(shown++,6)*70+'ms';el.classList.add('in');setTimeout(function(){shown=Math.max(0,shown-1);},120);}
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){show(e.target);io.unobserve(e.target);}});},{rootMargin:'0px 0px -8% 0px'});
    items.forEach(function(el){io.observe(el);});
  }else items.forEach(function(el){el.classList.add('in');});
  // точки карусели
  var car=R.getElementById('car'),dots=R.querySelectorAll('#dots i'),prev=R.getElementById('prev'),next=R.getElementById('next');
  function step(){return car.firstElementChild.offsetWidth+10;}
  function sync(){
    var i=Math.round(car.scrollLeft/step()),end=car.scrollLeft+car.clientWidth>=car.scrollWidth-4;
    if(end)i=dots.length-1;
    dots.forEach(function(d,k){d.classList.toggle('on',k===i);});
    prev.disabled=car.scrollLeft<4;next.disabled=end;
  }
  car.addEventListener('scroll',sync,{passive:true});
  prev.addEventListener('click',function(){car.scrollBy({left:-step(),behavior:'smooth'});});
  next.addEventListener('click',function(){car.scrollBy({left:step(),behavior:'smooth'});});
})();
</script>
